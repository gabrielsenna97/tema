<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checklist Cilindros</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
    }
    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 900px;
        margin: auto;
    }
    .cilindro {
        background-color: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0px 0px 6px rgba(0,0,0,0.2);
        text-align: center;
    }
    .cilindro img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        background-color: #f9f9f9;
        border: 1px dashed #ccc;
        cursor: pointer;
    }
    .cilindro textarea {
        width: 100%;
        height: 50px;
        margin-top: 5px;
        resize: none;
    }
    button {
        display: block;
        margin: 30px auto 0;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background-color: #0078d4;
        color: white;
        cursor: pointer;
    }
    button:hover {
        background-color: #005ea0;
    }
</style>
</head>
<body>

<h2 style="text-align:center;">Checklist Cilindros</h2>

<div class="container">
    <!-- 6 cilindros -->
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 1" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 1"></textarea>
    </div>
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 2" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 2"></textarea>
    </div>
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 3" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 3"></textarea>
    </div>
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 4" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 4"></textarea>
    </div>
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 5" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 5"></textarea>
    </div>
    <div class="cilindro">
        <input type="file" accept="image/*" capture="environment" style="display:none">
        <img src="" alt="Foto 6" onclick="this.previousElementSibling.click()">
        <textarea placeholder="Observação cilindro 6"></textarea>
    </div>
</div>

<button onclick="gerarPDF()">Gerar PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    document.querySelectorAll('.cilindro input[type="file"]').forEach(input => {
        input.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const img = this.nextElementSibling;
                img.src = URL.createObjectURL(this.files[0]);
                this.value = ""; // evita o duplo clique
            }
        });
    });

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let x = 10, y = 10, count = 0;

        document.querySelectorAll('.cilindro').forEach(cilindro => {
            const imgEl = cilindro.querySelector('img');
            const obs = cilindro.querySelector('textarea').value;

            if (imgEl.src) {
                doc.addImage(imgEl, 'JPEG', x, y, 60, 40);
                doc.text(obs, x, y + 45);
            }
            x += 65;
            count++;
            if (count % 3 === 0) {
                x = 10;
                y += 60;
            }
        });

        doc.save('cilindros.pdf');
    }
</script>

</body>
</html>
