<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Mantido exatamente igual ao seu CSS */
body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #d0f0c0; }
h1, h2, h3 { color: #333; margin-top: 20px; margin-bottom: 10px; }
h1 { font-size: 24px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
h2 { font-size: 20px; margin-top: 30px; margin-bottom: 15px; text-align: center; }
h3 { font-size: 16px; text-align: center; margin: 15px 0; }
.valve-container { display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 20px; }
.valve-section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; width: 32%; box-sizing: border-box; background-color: #ffffff; }
.valve-type { font-weight: bold; margin-top: 10px; text-align: center; padding: 5px; border-radius: 4px; }
.exaustao { background-color: #ffb84d; color: #333; }
.admissao { background-color: #2e8b57; color: #fff; }
.measurement { text-align: center; margin: 10px 0; font-size: 18px; }
input[type="text"], input[type="date"], textarea { width: 120px; padding: 8px; text-align: center; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; }
textarea { width: 100%; height: 100px; padding: 10px; text-align: left; resize: vertical; }
.info-table { width: 100%; margin-bottom: 20px; }
.info-table td { padding: 5px 0; text-align: left; }
.signature { margin-top: 50px; border-top: 1px solid #000; width: 320px; padding-top: 5px; text-align: center; font-weight: bold; font-size: 16px; position: relative; }
#assinatura { position: absolute; top: -36px; left: 0; width: 320px; border: none; font-size: 28px; text-align: center; background: transparent; outline: none; font-family: 'Brush Script MT', cursive, Arial, sans-serif; color: #000; }
#assinatura::placeholder { color: #999; }
.warning { background-color: #fff3cd; padding: 10px; border-left: 4px solid #ffc107; margin: 15px 0; text-align: center; }
.obs { margin-top: 30px; font-style: italic; }
.button-container { margin-top: 20px; text-align: center; }
button { background-color: #2e8b57; color: white; border: none; padding: 10px 20px; margin: 0 10px; font-size: 16px; border-radius: 4px; cursor: pointer; }
button.clear-btn { background-color: #ff6b6b; }
@media (max-width: 900px) { .valve-section { width: 100%; } }
</style>
</head>
<body>
<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<!-- Mantido tudo igual, incluindo inputs e layout -->

<!-- O código HTML completo permanece idêntico ao que você enviou -->

<script>
const { jsPDF } = window.jspdf;

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let linesCount = 0;

  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0) {
      ctx.fillText(line, x, y + linesCount * lineHeight);
      line = words[n] + ' ';
      linesCount++;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y + linesCount * lineHeight);
}

function padronizarValor(valor) {
  valor = valor.trim();
  if (/^\d{3}$/.test(valor)) {
    return valor.slice(0, 2) + ',' + valor.slice(2);
  }
  if (valor.includes('.')) return valor.replace('.', ',');
  return valor;
}

document.getElementById('generatePdf').addEventListener('click', async function() {
  const img = new Image();
  img.src = 'https://raw.githubusercontent.com/gabrielsenna97/Medi-o-de-V-lvulas/refs/heads/main/FORM.194_MEDI%C3%87%C3%83O%20DAS%20VALVULAS_UTE550_REV0_O%26M%20(2).jpg';
  img.crossOrigin = 'Anonymous';
  await new Promise(resolve => { img.onload = resolve; });

  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'left';

  ctx.fillText(document.getElementById('mecanico').value || '', 208, 176);
  ctx.fillText(document.getElementById('usina').value || '', 165, 204);
  ctx.fillText(document.getElementById('serie').value || '', 165, 231);
  const ugdVal = document.getElementById('ugd').value;
  ctx.fillText(ugdVal ? `UGD- ${ugdVal}` : '', 590, 262);
  ctx.fillText(document.getElementById('os').value || '', 292, 262);
  const dataValue = document.getElementById('data').value;
  if (dataValue) {
    const dataFormatada = new Date(dataValue).toLocaleDateString('pt-BR');
    ctx.fillText(dataFormatada, 888, 204);
  }
  ctx.fillText(document.getElementById('horimetro').value || '', 798, 231);

  const limiteMaximo = 67.50;

  // ⚡ Apenas ajustei as coordenadas dos campos
  const campos = [
    ['exaustao1_1', 105, 576], ['exaustao1_2', 105, 616], ['admissao1_1', 345, 589], ['admissao1_2', 345, 628],
    ['exaustao2_1', 450, 1024], ['exaustao2_2', 450, 1064], ['admissao2_1', 689, 1038], ['admissao2_2', 689, 1075],
    ['exaustao3_1', 792, 576], ['exaustao3_2', 792, 617], ['admissao3_1', 1032, 589], ['admissao3_2', 1032, 628],
    ['exaustao4_1', 793, 1024], ['exaustao4_2', 793, 1064], ['admissao4_1', 1033, 1038], ['admissao4_2', 1033, 1075],
    ['exaustao5_1', 450, 576], ['exaustao5_2', 450, 617], ['admissao5_1', 689, 589], ['admissao5_2', 689, 628],
    ['exaustao6_1', 105, 1024], ['exaustao6_2', 105, 1064], ['admissao6_1', 345, 1038], ['admissao6_2', 345, 1075]
  ];

  campos.forEach(([id, x, y]) => {
    let valRaw = document.getElementById(id)?.value || '';
    let val = padronizarValor(valRaw);
    let valNum = parseFloat(val.replace(',', '.'));
    if (!isNaN(valNum)) {
      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = valNum >= limiteMaximo ? 'red' : 'black';
      ctx.fillText(val, x, y);
    } else {
      ctx.font = '18px Arial';
      ctx.fillStyle = 'black';
      ctx.fillText(valRaw, x, y);
    }
  });

  const observacoes = document.getElementById('observacoes').value;
  wrapText(ctx, observacoes, 183, 1237, 950, 26);

  ctx.font = 'italic 40px Brush Script MT, cursive, Arial';
  ctx.fillText(document.getElementById('assinatura').value || '', 760, 1538);

  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const imgData = canvas.toDataURL('image/png');
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = pdf.internal.pageSize.getHeight();
  const scale = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height);
  const imgWidth = canvas.width * scale;
  const imgHeight = canvas.height * scale;
  const x = (pdfWidth - imgWidth) / 2;
  const y = 10;
  pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
  pdf.save('medicao-valvulas.pdf');
});

document.getElementById('clearBtn').addEventListener('click', function() {
  const inputs = document.querySelectorAll('input[type="text"], input[type="date"], textarea');
  inputs.forEach(input => input.value = '');
});

const camposMedicao = [
  'exaustao1_1', 'exaustao1_2', 'admissao1_1', 'admissao1_2',
  'exaustao2_1', 'exaustao2_2', 'admissao2_1', 'admissao2_2',
  'exaustao3_1', 'exaustao3_2', 'admissao3_1', 'admissao3_2',
  'exaustao4_1', 'exaustao4_2', 'admissao4_1', 'admissao4_2',
  'exaustao5_1', 'exaustao5_2', 'admissao5_1', 'admissao5_2',
  'exaustao6_1', 'exaustao6_2', 'admissao6_1', 'admissao6_2'
];

function verificarValorEColorir(input) {
  let valRaw = input.value.trim();
  let val = padronizarValor(valRaw);
  let num = parseFloat(val.replace(',', '.'));
  if (!isNaN(num)) {
    input.style.fontWeight = 'bold';
    input.style.color = num >= 67.50 ? 'red' : 'black';
  } else {
    input.style.fontWeight = '';
    input.style.color = '';
  }
}

camposMedicao.forEach(id => {
  const input = document.getElementById(id);
  if (input) {
    verificarValorEColorir(input);
    input.addEventListener('input', () => verificarValorEColorir(input));
  }
});
</script>
</body>
</html>
