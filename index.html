<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #d0f0c0; }
h1,h2,h3{ color:#333; margin-top:20px; margin-bottom:10px; }
h1{ font-size:24px; text-align:center; border-bottom:2px solid #333; padding-bottom:10px; }
.valve-container{ display:flex; flex-wrap:wrap; justify-content:space-between; margin-bottom:20px; }

.photo-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  justify-content: center;
  align-content: center;
  width: 100%;
  max-width: 250px;
}

.valve-type{ font-weight:bold; margin-top:10px; text-align:center; padding:5px; border-radius:4px; background-color:white; color:black; }
.measurement{ text-align:center; margin:10px 0; font-size:18px; background-color:white; border-radius:8px; padding:5px; font-weight:bold; color:black; }
input[type="text"], input[type="date"], textarea{ width:120px; padding:8px; text-align:center; font-size:16px; border:1px solid #ddd; border-radius:4px; }
textarea{ width:100%; height:100px; padding:10px; text-align:left; resize:vertical; }
.info-table{ width:100%; margin-bottom:20px; }
.info-table td{ padding:5px 0; text-align:left; }
.signature{ margin-top:50px; border-top:1px solid #000; width:320px; padding-top:5px; text-align:center; font-weight:bold; font-size:16px; position:relative; }
#assinatura{ position:absolute; top:-36px; left:0; width:320px; border:none; font-size:28px; text-align:center; background:transparent; outline:none; font-family:'Brush Script MT', cursive, Arial, sans-serif; color:#000; }
#assinatura::placeholder{ color:#999; }
.warning{ background-color:#fff3cd; padding:10px; border-left:4px solid #ffc107; margin:15px 0; text-align:center; }
.obs{ margin-top:30px; font-style:italic; }
.button-container{ margin-top:20px; text-align:center; }
button{ background-color:#2e8b57; color:white; border:none; padding:10px 20px; margin:0 10px; font-size:16px; border-radius:4px; cursor:pointer; }
button.clear-btn{ background-color:#ff6b6b; }

.photo-box{
  width:120px; height:120px; border:2px dashed #999; margin:10px auto; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:#666; position:relative; background-size:cover; background-position:center; overflow:hidden; border-radius:10px;
}
.photo-box input[type="file"]{ position:absolute; width:100%; height:100%; opacity:0; cursor:pointer; }
.remove-photo{ display:inline-block; margin-left:5px; background:#ff4d4d; color:#fff; border:none; padding:2px 5px; font-size:10px; cursor:pointer; border-radius:4px; vertical-align:top; }
.photo-label { position:absolute; bottom:0; width:100%; text-align:center; background-color:white; color:black; font-weight:bold; font-size:12px; border-top-left-radius:5px; border-top-right-radius:5px; padding:2px 0; }
.cilindro-label { text-align:center; font-weight:bold; color:black; background-color:white; border-radius:10px; padding:5px; margin-bottom:10px; font-size:16px; }

@media(max-width:900px){
  .valve-section{
    width:90%;       /* ocupa quase toda a tela no celular */
    padding:15px;
    margin: 0 auto;  /* centraliza */
  }
  .photo-grid{
    grid-template-columns: 1fr;  /* celular: 1 coluna */
    max-width: 100%;
  }
  .photo-box{
    max-width:100%;  /* usa toda a largura disponível */
  }
}
</style>
</head>
<body>

<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<table class="info-table">
<tr>
<td><strong>MECÂNICO:</strong> <input type="text" id="mecanico" style="width:200px;"></td>
<td><strong>DATA:</strong> <input type="date" id="data"></td>
</tr>
<tr>
<td><strong>USINA:</strong> <input type="text" id="usina" style="width:200px;"></td>
<td><strong>HORÍMETRO:</strong> <input type="text" id="horimetro"></td>
</tr>
<tr>
<td><strong>SÉRIE:</strong> <input type="text" id="serie" style="width:200px;"></td>
<td><strong>OS:</strong> <input type="text" id="os"></td>
</tr>
<tr>
<td><strong>UGD-</strong> <input type="text" id="ugd" style="width:60px;"></td>
<td></td>
</tr>
</table>

<div class="warning">
<h3>MEDIÇÕES ACEITÁVEIS: 64,00mm a <span style="font-weight:bold; color:red;">67,50mm</span></h3>
<h3>ACIMA DE <span style="font-weight:bold; color:red;">67,50mm</span> DEVE SER CONSIDERADA SUBSTITUIÇÃO</h3>
</div>

<div class="valve-container">
<script>
const container=document.currentScript.parentNode;
for(let i=1;i<=6;i++){
  const section=document.createElement('div');
  section.className='valve-section';
  section.innerHTML=`<div class="cilindro-label">${i}º CILINDRO</div>`;

  // Layout 2x2
  const layoutDiv = document.createElement('div');
  layoutDiv.className='photo-grid';  // usa CSS atualizado
  section.appendChild(layoutDiv);

  const posicoes=[
    {tipo:'exaustao', j:2},
    {tipo:'admissao', j:2},
    {tipo:'exaustao', j:1},
    {tipo:'admissao', j:1}
  ];

  posicoes.forEach(({tipo,j})=>{
    const tipoNome = tipo==='exaustao'?'EXAUSTÃO':'ADMISSÃO';
    const idPhoto=tipo+i+'_'+j;
    const div = document.createElement('div');
    div.style.textAlign='center';
    div.innerHTML=`
      <div class="measurement"><input type="text" id="${tipo}${i}_${j}" placeholder="${tipoNome} ${j}"></div>
      <div class="photo-box" id="photo${idPhoto}">
        Clique para adicionar foto
        <div class="photo-label">${tipoNome} ${j}</div>
        <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,'${idPhoto}')">
      </div>
      <button class="remove-photo" onclick="removePhoto('${idPhoto}')">REMOVER FOTO</button>
    `;
    layoutDiv.appendChild(div);
  });

  container.appendChild(section);
}
</script>
</div>

<div class="obs">
<p><strong>OBSERVAÇÕES:</strong></p>
<textarea id="observacoes"></textarea>
</div>

<div class="button-container">
<button id="generatePdf">Gerar PDF</button>
<button id="generateJpg">Gerar JPG</button>
<button id="clearBtn" class="clear-btn">Limpar</button>
</div>

<div class="signature">
ASSINATURA DO MECÂNICO: 
<input type="text" id="assinatura" placeholder="Digite seu nome aqui" />
</div>

<script>
// --- FUNÇÕES DE FOTO ---
function loadPhoto(event,id){
  const box=document.getElementById('photo'+id);
  const file=event.target.files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=function(e){
      box.style.backgroundImage=`url('${e.target.result}')`;
      box.textContent='';
    }
    reader.readAsDataURL(file);
  }
}

function removePhoto(id){
  const box = document.getElementById('photo' + id);
  box.style.backgroundImage = '';
  box.textContent = 'Clique para adicionar foto';
  const oldInput = box.querySelector('input[type="file"]');
  if (oldInput) oldInput.remove();
  const newInput = document.createElement('input');
  newInput.type = 'file';
  newInput.accept = 'image/*';
  newInput.capture = 'environment';
  newInput.onchange = (event) => loadPhoto(event, id);
  box.appendChild(newInput);
}

// --- OUTROS SCRIPTS (PDF, JPG, Limpar, Destaque) ---
/* Mantive todos os scripts que você já tinha funcionando */
</script>

</body>
</html>
