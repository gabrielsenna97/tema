<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cilindros</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f3f3;
        margin: 0;
        padding: 20px;
        text-align: center;
    }
    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
    }
    .cilindro {
        background: white;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .cilindro img {
        width: 100%;
        height: auto;
        border-radius: 8px;
    }
    .obs {
        margin-top: 8px;
        font-size: 14px;
        color: #333;
    }
    .add-foto {
        border: 2px dashed #aaa;
        padding: 40px 10px;
        cursor: pointer;
        color: #555;
        border-radius: 8px;
    }
    button {
        margin-top: 20px;
        padding: 10px 20px;
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background: #0b5ed7;
    }
</style>
</head>
<body>

<h1>Registro de Cilindros</h1>
<div class="container" id="cilindros">
    <!-- Gerado via JavaScript -->
</div>

<button onclick="gerarPDF()">Gerar PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const { jsPDF } = window.jspdf;

const container = document.getElementById('cilindros');
const imagens = [];

for (let i = 1; i <= 6; i++) {
    const div = document.createElement('div');
    div.className = 'cilindro';

    const addFoto = document.createElement('div');
    addFoto.className = 'add-foto';
    addFoto.textContent = 'Adicionar Foto ' + i;

    const img = document.createElement('img');
    img.style.display = 'none';

    const obs = document.createElement('input');
    obs.type = 'text';
    obs.className = 'obs';
    obs.placeholder = 'Observação...';

    const inputFile = document.createElement('input');
    inputFile.type = 'file';
    inputFile.accept = 'image/*';
    inputFile.capture = 'environment';
    inputFile.style.display = 'none';

    addFoto.onclick = () => inputFile.click();

    inputFile.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = () => {
                img.src = reader.result;
                img.style.display = 'block';
                addFoto.style.display = 'none';
                imagens[i-1] = { img: reader.result, obs: obs.value };
            };
            reader.readAsDataURL(file);
        }
    };

    obs.oninput = () => {
        if (imagens[i-1]) imagens[i-1].obs = obs.value;
    };

    div.appendChild(addFoto);
    div.appendChild(img);
    div.appendChild(obs);
    div.appendChild(inputFile);
    container.appendChild(div);
}

function gerarPDF() {
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const cols = 3;
    const rows = 3;
    const cellWidth = pageWidth / cols;
    const cellHeight = pageHeight / rows;

    let index = 0;
    imagens.forEach((item, i) => {
        if (!item || !item.img) return;
        const col = index % cols;
        const row = Math.floor(index / cols);
        const x = col * cellWidth;
        const y = row * cellHeight;

        // Ajusta imagem para manter proporção
        const imgProps = pdf.getImageProperties(item.img);
        let imgW = cellWidth - 10;
        let imgH = (imgProps.height * imgW) / imgProps.width;
        if (imgH > cellHeight - 15) {
            imgH = cellHeight - 15;
            imgW = (imgProps.width * imgH) / imgProps.height;
        }
        const imgX = x + (cellWidth - imgW) / 2;
        const imgY = y + 5;

        pdf.addImage(item.img, 'JPEG', imgX, imgY, imgW, imgH);
        pdf.setFontSize(10);
        pdf.text(item.obs || '', x + 5, y + cellHeight - 5);

        index++;
    });

    pdf.save('cilindros.pdf');
}
</script>

</body>
</html>
