<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload de Fotos por Cilindro</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    padding: 20px;
  }
  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .cilindro {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .cilindro h3 {
    text-align: center;
    margin-bottom: 10px;
  }
  .fotos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .foto {
    position: relative;
    border: 2px dashed #ccc;
    border-radius: 8px;
    overflow: hidden;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
  }
  .foto input {
    display: none;
  }
  .foto label {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .icone {
    font-size: 30px;
    color: #666;
  }
  .botoes {
    display: flex;
    gap: 8px;
  }
</style>
</head>
<body>

<h1>Upload de Fotos por Cilindro</h1>
<div class="container">
  <!-- Exemplo para Cilindro 1 -->
  <div class="cilindro">
    <h3>Cilindro 1</h3>
    <div class="fotos">
      <div class="foto">
        <div class="botoes">
          <!-- Botão câmera -->
          <label>
            📷
            <input type="file" accept="image/*" capture="environment" onchange="previewImage(event, this)">
          </label>
          <!-- Botão galeria -->
          <label>
            🖼️
            <input type="file" accept="image/*" onchange="previewImage(event, this)">
          </label>
        </div>
      </div>
      <div class="foto">
        <div class="botoes">
          <label>📷
            <input type="file" accept="image/*" capture="environment" onchange="previewImage(event, this)">
          </label>
          <label>🖼️
            <input type="file" accept="image/*" onchange="previewImage(event, this)">
          </label>
        </div>
      </div>
      <div class="foto">
        <div class="botoes">
          <label>📷
            <input type="file" accept="image/*" capture="environment" onchange="previewImage(event, this)">
          </label>
          <label>🖼️
            <input type="file" accept="image/*" onchange="previewImage(event, this)">
          </label>
        </div>
      </div>
      <div class="foto">
        <div class="botoes">
          <label>📷
            <input type="file" accept="image/*" capture="environment" onchange="previewImage(event, this)">
          </label>
          <label>🖼️
            <input type="file" accept="image/*" onchange="previewImage(event, this)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Repita essa estrutura para Cilindro 2 a 6 -->
</div>

<script>
function previewImage(event, input) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const fotoDiv = input.closest('.foto');
      fotoDiv.innerHTML = `<img src="${e.target.result}" alt="Foto">`;
    };
    reader.readAsDataURL(file);
  }
}
</script>

</body>
</html>
