<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #d0f0c0; }
h1,h2,h3{ color:#333; margin-top:20px; margin-bottom:10px; }
h1{ font-size:24px; text-align:center; border-bottom:2px solid #333; padding-bottom:10px; }
.valve-container{ display:flex; flex-wrap:wrap; justify-content:space-between; margin-bottom:20px; }
.valve-section{ border:1px solid #ddd; padding:15px; margin-bottom:20px; width:32%; box-sizing:border-box; background-color:#fff; border-radius:10px; }
.valve-type{ font-weight:bold; margin-top:10px; text-align:center; padding:5px; border-radius:4px; background-color:white; color:black; }
.measurement{ text-align:center; margin:10px 0; font-size:18px; background-color:white; border-radius:8px; padding:5px; font-weight:bold; color:black; }
input[type="text"], input[type="date"], textarea{ width:120px; padding:8px; text-align:center; font-size:16px; border:1px solid #ddd; border-radius:4px; }
textarea{ width:100%; height:100px; padding:10px; text-align:left; resize:vertical; }
.info-table{ width:100%; margin-bottom:20px; }
.info-table td{ padding:5px 0; text-align:left; }
.signature{ margin-top:50px; border-top:1px solid #000; width:320px; padding-top:5px; text-align:center; font-weight:bold; font-size:16px; position:relative; }
#assinatura{ position:absolute; top:-36px; left:0; width:320px; border:none; font-size:28px; text-align:center; background:transparent; outline:none; font-family:'Brush Script MT', cursive, Arial, sans-serif; color:#000; }
#assinatura::placeholder{ color:#999; }
.warning{ background-color:#fff3cd; padding:10px; border-left:4px solid #ffc107; margin:15px 0; text-align:center; }
.obs{ margin-top:30px; font-style:italic; }
.button-container{ margin-top:20px; text-align:center; }
button{ background-color:#2e8b57; color:white; border:none; padding:10px 20px; margin:0 10px; font-size:16px; border-radius:4px; cursor:pointer; }
button.clear-btn{ background-color:#ff6b6b; }
.photo-box{
  width:120px; height:120px; border:2px dashed #999; margin:10px auto; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:#666; position:relative; background-size:cover; background-position:center; overflow:hidden; border-radius:10px;
}
.photo-box input[type="file"]{ position:absolute; width:100%; height:100%; opacity:0; cursor:pointer; }
.remove-photo{ display:inline-block; margin-left:5px; background:#ff4d4d; color:#fff; border:none; padding:2px 5px; font-size:10px; cursor:pointer; border-radius:4px; vertical-align:top; }
.photo-label { position:absolute; bottom:0; width:100%; text-align:center; background-color:white; color:black; font-weight:bold; font-size:12px; border-top-left-radius:5px; border-top-right-radius:5px; padding:2px 0; }
.cilindro-label { text-align:center; font-weight:bold; color:black; background-color:white; border-radius:10px; padding:5px; margin-bottom:10px; font-size:16px; }
@media(max-width:900px){ .valve-section{ width:100%; } }
</style>
</head>
<body>

<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<table class="info-table">
<tr>
  <td><strong>MECÂNICO:</strong> <input type="text" id="mecanico" style="width:200px;"></td>
  <td><strong>DATA:</strong> <input type="date" id="data"></td>
</tr>
<tr>
  <td><strong>USINA:</strong> <input type="text" id="usina" style="width:200px;"></td>
  <td><strong>HORÍMETRO:</strong> <input type="text" id="horimetro"></td>
</tr>
<tr>
  <td><strong>SÉRIE:</strong> <input type="text" id="serie" style="width:200px;"></td>
  <td><strong>OS:</strong> <input type="text" id="os"></td>
</tr>
<tr>
  <td><strong>UGD-</strong> <input type="text" id="ugd" style="width:60px;"></td>
  <td></td>
</tr>
</table>

<div class="warning">
  <h3>MEDIÇÕES ACEITÁVEIS: 64,00mm a <span style="font-weight:bold; color:red;">67,50mm</span></h3>
  <h3>ACIMA DE <span style="font-weight:bold; color:red;">67,50mm</span> DEVE SER CONSIDERADA SUBSTITUIÇÃO</h3>
</div>

<div class="valve-container">
<script>
const container=document.currentScript.parentNode;
const tipos=['exaustao','admissao'];
for(let i=1;i<=6;i++){
  const section=document.createElement('div');
  section.className='valve-section';
  section.innerHTML=`<div class="cilindro-label">${i}º CILINDRO</div>`;
  tipos.forEach(tipo=>{
    const tipoNome=tipo==='exaustao'?'EXAUSTÃO':'ADMISSÃO';
    section.innerHTML+=`<div class="valve-type">${tipoNome}</div>`;
    for(let j=1;j<=2;j++){
      const idPhoto=tipo+i+'_'+j;
      section.innerHTML+=`
      <div style="text-align:center; margin-bottom:10px;">
        <div class="measurement"><input type="text" id="${tipo}${i}_${j}" placeholder="${tipoNome} ${j}"></div>
        <div class="photo-box" id="photo${idPhoto}">
          Clique para adicionar foto
          <div class="photo-label">${tipoNome} ${j}</div>
          <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,'${idPhoto}')">
        </div>
        <button class="remove-photo" onclick="removePhoto('${idPhoto}')">REMOVER FOTO</button>
      </div>`;
    }
  });
  container.appendChild(section);
}
</script>
</div>

<div class="obs">
  <p><strong>OBSERVAÇÕES:</strong></p>
  <textarea id="observacoes"></textarea>
</div>

<div class="button-container">
  <button id="generatePdf">Gerar PDF</button>
  <button id="generateJpg">Gerar JPG</button>
  <button id="clearBtn" class="clear-btn">Limpar</button>
</div>

<div class="signature">
  ASSINATURA DO MECÂNICO: 
  <input type="text" id="assinatura" placeholder="Digite seu nome aqui" />
</div>

<script>
const { jsPDF }=window.jspdf;

function loadPhoto(event,id){
  const box=document.getElementById('photo'+id);
  const file=event.target.files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=function(e){
      box.style.backgroundImage=`url('${e.target.result}')`;
      box.textContent='';
    }
    reader.readAsDataURL(file);
  }
}

// CORREÇÃO: Remove e recria input para permitir nova seleção
function removePhoto(id){
  const box = document.getElementById('photo'+id);
  box.style.backgroundImage = '';
  box.textContent = 'Clique para adicionar foto';
  
  const oldInput = box.querySelector('input[type="file"]');
  if(oldInput){
    oldInput.remove(); // remove antigo
    const newInput = document.createElement('input');
    newInput.type = 'file';
    newInput.accept = 'image/*';
    newInput.capture = 'environment';
    newInput.style.position = 'absolute';
    newInput.style.width = '100%';
    newInput.style.height = '100%';
    newInput.style.opacity = '0';
    newInput.style.cursor = 'pointer';
    newInput.addEventListener('change', (event) => loadPhoto(event, id));
    box.appendChild(newInput); // adiciona novo input
  }
}

// --- GERAR PDF ---
document.getElementById('generatePdf').addEventListener('click', async function(){
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'https://raw.githubusercontent.com/gabrielsenna97/tema/main/FORM_194_MEDICAO_DAS_VALVULAS_UTE550_REV0_O_M_2.jpg';
  await new Promise(resolve=>img.onload=resolve);

  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img,0,0);

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'black';
  ctx.fillText(document.getElementById('mecanico').value || '', 208, 176);
  ctx.fillText(document.getElementById('usina').value || '', 165, 204);
  ctx.fillText(document.getElementById('serie').value || '', 165, 231);
  ctx.fillText('UGD- '+(document.getElementById('ugd').value||''), 590, 262);
  ctx.fillText(document.getElementById('os').value || '', 292, 262);
  const dataVal = document.getElementById('data').value;
  if(dataVal) ctx.fillText(new Date(dataVal).toLocaleDateString('pt-BR'), 888, 204);
  ctx.fillText(document.getElementById('horimetro').value || '', 798, 231);

  const limiteMaximo = 67.50;
  const campos = [
    ['exaustao1_1',105,616], ['exaustao1_2',105,576], ['admissao1_1',345,628], ['admissao1_2',345,589],
    ['exaustao2_1',450,1064], ['exaustao2_2',450,1024], ['admissao2_1',689,1075], ['admissao2_2',689,1038],
    ['exaustao3_1',792,617], ['exaustao3_2',792,576], ['admissao3_1',1032,628], ['admissao3_2',1032,589],
    ['exaustao4_1',793,1064], ['exaustao4_2',793,1024], ['admissao4_1',1033,1075], ['admissao4_2',1033,1038],
    ['exaustao5_1',450,617], ['exaustao5_2',450,576], ['admissao5_1',689,628], ['admissao5_2',689,589],
    ['exaustao6_1',105,1064], ['exaustao6_2',105,1024], ['admissao6_1',345,1075], ['admissao6_2',345,1038]
  ];
  campos.forEach(([id,x,y])=>{
    const valRaw = document.getElementById(id)?.value || '';
    const valNum = parseFloat(valRaw.replace(',', '.'));
    if(!isNaN(valNum) && valNum >= limiteMaximo){
      ctx.fillStyle='red';
      ctx.font='bold 18px Arial';
    } else {
      ctx.fillStyle='black';
      ctx.font='18px Arial';
    }
    ctx.fillText(valRaw, x, y);
  });

  const obs = document.getElementById('observacoes').value;
  const maxWidth = 950;
  const lineHeight = 26;
  const words = obs.split(' ');
  let line = '';
  let y = 1237;
  words.forEach(word=>{
    const testLine = line + word + ' ';
    const metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth){
      ctx.fillText(line, 183, y);
      line = word + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  });
  ctx.fillText(line, 183, y);

  ctx.font = '28px "Brush Script MT", cursive';
  ctx.fillText(document.getElementById('assinatura').value || '', 108, 1448);

  const imgData = canvas.toDataURL('image/jpeg',1.0);
  pdf.addImage(imgData,'JPEG',0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight());
  pdf.save('MEDICAO_VALVULAS.pdf');
});

// --- GERAR JPG ---
document.getElementById('generateJpg').addEventListener('click', async function(){
  // Lógica JPG (igual ao anterior)...
});

// --- LIMPAR ---
document.getElementById('clearBtn').addEventListener('click',function(){
  const inputs=document.querySelectorAll('input[type="text"], input[type="date"], textarea');
  inputs.forEach(input=>input.value='');
  const photos=document.querySelectorAll('.photo-box');
  photos.forEach(box=>{
    box.style.backgroundImage='';
    box.textContent='Clique para adicionar foto';
    const input=box.querySelector('input[type="file"]');
    if(input) input.value='';
  });
});

// --- DESTAQUE AUTOMÁTICO ---
function atualizarDestaque(input) {
  const valor = parseFloat(input.value.replace(',', '.'));
  if (!isNaN(valor) && valor >= 67.50) {
    input.style.color = "red";
    input.style.fontWeight = "bold";
  } else {
    input.style.color = "black";
    input.style.fontWeight = "normal";
  }
}
const camposMedicao = document.querySelectorAll('input[id^="exaustao"], input[id^="admissao"]');
camposMedicao.forEach(input => {
  input.addEventListener('input', () => atualizarDestaque(input));
});
</script>

</body>
</html>
