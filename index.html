<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cilindros</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f3f3f3; }
    h1 { text-align: center; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .cilindro {
        border: 1px solid #ccc;
        background: white;
        padding: 10px;
        width: 300px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .cilindro img {
        width: 100%;
        height: auto;
        display: block;
        margin-bottom: 5px;
        border-radius: 4px;
        border: 1px solid #ddd;
    }
    textarea {
        width: 100%;
        height: 50px;
        resize: none;
        border-radius: 4px;
        border: 1px solid #ccc;
        padding: 5px;
    }
    button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #0078d4;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover {
        background-color: #005a9e;
    }
</style>
</head>
<body>

<h1>Registro de Cilindros</h1>
<div class="container">
    <div class="cilindro">
        <h2>Cilindro 1</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
    <div class="cilindro">
        <h2>Cilindro 2</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
    <div class="cilindro">
        <h2>Cilindro 3</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
    <div class="cilindro">
        <h2>Cilindro 4</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
    <div class="cilindro">
        <h2>Cilindro 5</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
    <div class="cilindro">
        <h2>Cilindro 6</h2>
        <input type="file" accept="image/*">
        <img>
        <textarea class="obs" placeholder="Observações"></textarea>
    </div>
</div>

<button id="gerarPDF">Gerar PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for(let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

// CORREÇÃO DO DUPLO CLIQUE
document.querySelectorAll('input[type=file]').forEach(input => {
    input.addEventListener('change', function(){
        if(this.files && this.files[0]){
            const img = this.nextElementSibling;
            img.src = URL.createObjectURL(this.files[0]);
            this.value = ""; // <-- resolve o problema
        }
    });
});

document.getElementById('gerarPDF').addEventListener('click', async()=>{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");

    const blocos = document.querySelectorAll('.cilindro');
    let col = 0, row = 0;
    const colWidth = 60;  // largura no PDF
    const rowHeight = 90; // altura no PDF

    for(let i=0; i<blocos.length; i++){
        const bloco = blocos[i];
        const canvas = document.createElement('canvas');
        canvas.width = 350;
        canvas.height = 350;
        const ctx = canvas.getContext('2d');

        ctx.font = "14px Arial";
        ctx.fillText(bloco.querySelector('h2').textContent, 10, 18);

        const imgs = bloco.querySelectorAll('img');
        let px = 0, py = 25;
        for(let j=0; j<imgs.length; j++){
            if(imgs[j].src){
                const img = await loadImage(imgs[j].src);
                ctx.drawImage(img, px, py, 170, 120);
            }
            px += 175;
            if(j === 1){ px = 0; py += 125; }
        }

        ctx.font = "11px Arial";
        wrapText(ctx, bloco.querySelector('.obs').value, 10, 330, 320, 13);

        const imgData = canvas.toDataURL("image/jpeg", 1.0);
        const posX = col * colWidth + 10;
        const posY = row * rowHeight + 10;
        pdf.addImage(imgData, "JPEG", posX, posY, colWidth, rowHeight);

        col++;
        if(col === 3){ col = 0; row++; }
    }

    pdf.save("cilindros.pdf");
});
</script>

</body>
</html>
