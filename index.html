<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registro Fotográfico — 6 Cilindros</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f3f3;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #004080;
    }
    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        justify-items: center;
    }
    .cilindro {
        background: white;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 0 6px rgba(0,0,0,0.15);
        width: 280px;
    }
    .grid-fotos {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
    }
    .foto {
        border: 2px dashed #ccc;
        border-radius: 6px;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        background-color: #fafafa;
    }
    .foto img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    .foto span {
        color: #777;
        font-size: 14px;
    }
    textarea {
        width: 100%;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ccc;
        padding: 5px;
        font-size: 12px;
        resize: vertical;
    }
    .botoes {
        text-align: center;
        margin-top: 15px;
    }
    button {
        padding: 8px 12px;
        margin: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    .gerar {
        background-color: #0066cc;
        color: white;
    }
    .limpar {
        background-color: #cc0000;
        color: white;
    }
    small {
        display: block;
        text-align: center;
        margin-top: 10px;
        color: #555;
    }
</style>
</head>
<body>

<h1>Registro Fotográfico — 6 Cilindros (Gerar PDF 3×3 A4 Vertical)</h1>
<div class="container" id="container"></div>

<div class="botoes">
    <button class="gerar">Gerar PDF (A4 Vertical, layout 3×3)</button>
    <button class="limpar" onclick="limparTudo()">Limpar Tudo</button>
</div>
<small>Use o ícone na caixa para adicionar foto. Clique no botão de remover para excluir uma imagem.</small>

<script>
function criarCilindro(numero) {
    let div = document.createElement('div');
    div.className = 'cilindro';

    let titulo = document.createElement('h3');
    titulo.textContent = `${numero}º Cilindro`;
    div.appendChild(titulo);

    let grid = document.createElement('div');
    grid.className = 'grid-fotos';

    for (let i = 1; i <= 4; i++) {
        let box = document.createElement('div');
        box.className = 'foto';

        let img = document.createElement('img');
        img.style.display = 'none';

        let texto = document.createElement('span');
        texto.textContent = `Foto ${i}`;

        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';

        // clique único para abrir seletor
        box.addEventListener('click', () => input.click());

        input.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                let reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    img.style.display = 'block';
                    texto.style.display = 'none';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        box.appendChild(img);
        box.appendChild(texto);
        box.appendChild(input);
        grid.appendChild(box);
    }

    div.appendChild(grid);

    let obs = document.createElement('textarea');
    obs.placeholder = 'Descreva observação de afundamento...';
    div.appendChild(obs);

    return div;
}

for (let i = 1; i <= 6; i++) {
    document.getElementById('container').appendChild(criarCilindro(i));
}

function limparTudo() {
    document.querySelectorAll('.foto img').forEach(img => {
        img.src = '';
        img.style.display = 'none';
    });
    document.querySelectorAll('.foto span').forEach(span => {
        span.style.display = 'block';
    });
    document.querySelectorAll('textarea').forEach(txt => txt.value = '');
    document.querySelectorAll('.foto input').forEach(inp => inp.value = '');
}
</script>

</body>
</html>
