<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cilindros</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f3f3;
        margin: 0;
        padding: 20px;
    }
    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 900px;
        margin: auto;
    }
    .cilindro {
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        text-align: center;
    }
    .foto {
        width: 100%;
        height: 200px;
        background-color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 6px;
        overflow: hidden;
    }
    .foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    textarea {
        width: 100%;
        margin-top: 8px;
        padding: 5px;
        resize: none;
    }
    button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
</style>
</head>
<body>

<h1 style="text-align:center;">Cilindros</h1>

<div class="container">
    <!-- Criando 6 cilindros -->
    <div class="cilindro" data-num="1">
        <div class="foto" onclick="document.getElementById('file1').click()">
            <img id="preview1" src="" alt="Foto 1">
        </div>
        <input type="file" id="file1" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 1)">
        <textarea id="obs1" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
    <div class="cilindro" data-num="2">
        <div class="foto" onclick="document.getElementById('file2').click()">
            <img id="preview2" src="" alt="Foto 2">
        </div>
        <input type="file" id="file2" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 2)">
        <textarea id="obs2" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
    <div class="cilindro" data-num="3">
        <div class="foto" onclick="document.getElementById('file3').click()">
            <img id="preview3" src="" alt="Foto 3">
        </div>
        <input type="file" id="file3" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 3)">
        <textarea id="obs3" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
    <div class="cilindro" data-num="4">
        <div class="foto" onclick="document.getElementById('file4').click()">
            <img id="preview4" src="" alt="Foto 4">
        </div>
        <input type="file" id="file4" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 4)">
        <textarea id="obs4" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
    <div class="cilindro" data-num="5">
        <div class="foto" onclick="document.getElementById('file5').click()">
            <img id="preview5" src="" alt="Foto 5">
        </div>
        <input type="file" id="file5" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 5)">
        <textarea id="obs5" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
    <div class="cilindro" data-num="6">
        <div class="foto" onclick="document.getElementById('file6').click()">
            <img id="preview6" src="" alt="Foto 6">
        </div>
        <input type="file" id="file6" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 6)">
        <textarea id="obs6" placeholder="Observação sobre afundamento de válvulas"></textarea>
    </div>
</div>

<button onclick="gerarPDF()">Gerar PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
function previewImage(event, num) {
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById('preview' + num).src = reader.result;
    }
    reader.readAsDataURL(event.target.files[0]);
}

async function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

    let x = 10, y = 10;
    const imgW = 60, imgH = 50; // Tamanho da imagem no PDF
    const cellW = 65, cellH = 70; // Espaço por cilindro

    for (let i = 1; i <= 6; i++) {
        const img = document.getElementById('preview' + i).src;
        const obs = document.getElementById('obs' + i).value || "";

        if (img) {
            doc.addImage(img, "JPEG", x, y, imgW, imgH);
        } else {
            doc.setDrawColor(0);
            doc.rect(x, y, imgW, imgH);
        }

        doc.setFontSize(10);
        doc.text(obs, x, y + imgH + 5, { maxWidth: imgW });

        x += cellW;
        if (i % 3 === 0) {
            x = 10;
            y += cellH;
        }
    }

    doc.save("cilindros.pdf");
}
</script>

</body>
</html>
