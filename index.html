<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color:#fff; }
h1{ text-align:center; color:#fff; background-color:#257500; padding:10px; border-radius:8px; }
.info-table td{ padding:5px; }
.photo-box{ width:120px;height:120px;border:2px dashed #FF8C00;margin:10px auto;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#666;position:relative;background-size:cover;background-position:center;overflow:hidden;border-radius:10px;}
.photo-box input[type="file"]{ position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;}
button{ padding:10px 20px; margin:5px; cursor:pointer; border-radius:6px; border:none; background-color:#257500; color:#fff; font-weight:bold; }
button.clear-btn{ background-color:#FF4500; }
.cilindro-label { text-align:center; font-weight:bold; color:white; background-color:#257500; border-radius:10px; padding:5px; margin-bottom:10px; font-size:16px; }
</style>
</head>
<body>

<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<table class="info-table">
<tr>
<td><strong>MECÂNICO:</strong> <input type="text" id="mecanico" style="width:200px;"></td>
<td><strong>DATA:</strong> <input type="date" id="data"></td>
</tr>
<tr>
<td><strong>USINA:</strong> <input type="text" id="usina" style="width:200px;"></td>
<td><strong>HORÍMETRO:</strong> <input type="text" id="horimetro"></td>
</tr>
<tr>
<td><strong>SÉRIE:</strong> <input type="text" id="serie" style="width:200px;"></td>
<td><strong>OS:</strong> <input type="text" id="os"></td>
</tr>
<tr>
<td><strong>UGD-</strong> <input type="text" id="ugd" style="width:60px;"></td>
<td></td>
</tr>
</table>

<div id="valve-container"></div>

<div>
<h3>OBSERVAÇÕES</h3>
<textarea id="observacoes" style="width:100%; height:80px;"></textarea>
</div>

<div>
<label>ASSINATURA:</label>
<input type="text" id="assinatura" placeholder="Digite seu nome aqui" style="width:300px;">
</div>

<div style="margin-top:20px;">
<button id="generatePdf">Gerar PDF</button>
<button id="clearBtn" class="clear-btn">Limpar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// --- Criar seções de cilindros ---
const container = document.getElementById('valve-container');
for(let i=1;i<=6;i++){
  const section = document.createElement('div');
  section.style.border="2px solid #257500"; section.style.padding="15px"; section.style.marginBottom="20px"; section.style.borderRadius="10px";
  section.innerHTML=`<div class="cilindro-label">${i}º CILINDRO</div>`;
  
  const layoutDiv = document.createElement('div');
  layoutDiv.style.display='grid';
  layoutDiv.style.gridTemplateColumns='1fr 1fr';
  layoutDiv.style.gridTemplateRows='1fr 1fr';
  layoutDiv.style.gap='10px';
  
  const posicoes=[{tipo:'exaustao',j:2},{tipo:'admissao',j:2},{tipo:'exaustao',j:1},{tipo:'admissao',j:1}];
  
  posicoes.forEach(({tipo,j})=>{
    const tipoNome = tipo==='exaustao'?'EXAUSTÃO':'ADMISSÃO';
    const idPhoto=tipo+i+'_'+j;
    const div = document.createElement('div');
    div.style.textAlign='center';
    div.innerHTML=`
      <div><input type="text" id="${tipo}${i}_${j}" placeholder="${tipoNome} ${j}" style="width:80px;text-align:center;"></div>
      <div class="photo-box" id="photo${idPhoto}">Clique para adicionar foto
        <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,'${idPhoto}')">
      </div>
      <button onclick="removePhoto('${idPhoto}')">REMOVER FOTO</button>
    `;
    layoutDiv.appendChild(div);
  });
  
  const btn = document.createElement('button');
  btn.textContent = `Gerar JPG Cilindro ${i}`;
  btn.addEventListener('click',()=>generateJPG(i));
  
  section.appendChild(layoutDiv);
  section.appendChild(btn);
  container.appendChild(section);
}

// --- Funções de foto ---
function loadPhoto(event,id){
  const box=document.getElementById('photo'+id);
  const file=event.target.files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=function(e){
      box.style.backgroundImage=`url('${e.target.result}')`;
      box.textContent='';
    }
    reader.readAsDataURL(file);
  }
}

function removePhoto(id){
  const box = document.getElementById('photo'+id);
  box.style.backgroundImage=''; box.textContent='Clique para adicionar foto';
  const oldInput = box.querySelector('input[type="file"]');
  if(oldInput) oldInput.remove();
  const newInput = document.createElement('input');
  newInput.type='file'; newInput.accept='image/*'; newInput.capture='environment';
  newInput.onchange = (event)=>loadPhoto(event,id);
  box.appendChild(newInput);
}

// --- Gerar JPG por cilindro ---
async function generateJPG(cil){
  const canvas = document.createElement('canvas');
  canvas.width = 1280; canvas.height = 1600;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Texto principal
  ctx.fillStyle="black"; ctx.font="24px Arial"; ctx.fillText(`CILINDRO ${cil}`, 50, 50);
  ctx.font="20px Arial";
  ctx.fillText(`Mecânico: ${document.getElementById('mecanico').value}`,50,90);
  ctx.fillText(`USINA: ${document.getElementById('usina').value}`,50,120);
  ctx.fillText(`Série: ${document.getElementById('serie').value}`,50,150);
  ctx.fillText(`UGD: ${document.getElementById('ugd').value}`,50,180);
  ctx.fillText(`OS: ${document.getElementById('os').value}`,50,210);
  ctx.fillText(`Data: ${document.getElementById('data').value}`,50,240);
  ctx.fillText(`Horímetro: ${document.getElementById('horimetro').value}`,50,270);
  ctx.fillText(`Observações: ${document.getElementById('observacoes').value}`,50,300);
  ctx.fillText(`Assinatura: ${document.getElementById('assinatura').value}`,50,330);
  
  // Fotos
  const fotos = [`photoexaustao${cil}_2`,`photoadmissao${cil}_2`,`photoexaustao${cil}_1`,`photoadmissao${cil}_1`];
  for(let i=0;i<fotos.length;i++){
    const box = document.getElementById(fotos[i]);
    if(box.style.backgroundImage){
      let imgUrl = box.style.backgroundImage.replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
      const img = new Image();
      img.src = imgUrl;
      await new Promise(resolve=>img.onload=resolve);
      const x = (i%2)*canvas.width/2;
      const y = Math.floor(i/2)*(canvas.height/2)+350;
      ctx.drawImage(img,x,y,canvas.width/2,canvas.height/2);
      box.style.backgroundImage=''; box.textContent='Clique para adicionar foto';
    }
  }
  
  // Download
  const link = document.createElement('a');
  link.download = `Cilindro${cil}.jpg`;
  link.href = canvas.toDataURL('image/jpeg',0.95);
  link.click();
}

// --- Limpar campos ---
document.getElementById('clearBtn').addEventListener('click',()=>{
  const inputs = document.querySelectorAll('input[type="text"], input[type="date"], textarea');
  inputs.forEach(input=>input.value='');
  const photos = document.querySelectorAll('.photo-box');
  photos.forEach(box=>{box.style.backgroundImage=''; box.textContent='Clique para adicionar foto';});
});

</script>
</body>
</html>
