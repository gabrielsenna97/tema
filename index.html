<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { 
font-family: Arial, sans-serif; 
margin: 20px; 
line-height: 1.6; 
background-color: #ffffff; 
}

h1,h2,h3{ 
margin-top:20px; 
margin-bottom:10px; 
}

h1{ 
font-size:24px; 
text-align:center; 
border-bottom:3px solid #257500; 
padding-bottom:10px; 
color: #ffffff; 
background-color: #257500; 
border-radius:8px;
}

.valve-container{ 
display:flex; 
flex-wrap:wrap; 
justify-content:space-between; 
margin-bottom:20px; 
}

.valve-section{ 
border:2px solid #257500; 
padding:15px; 
margin-bottom:20px; 
width:32%; 
box-sizing:border-box; 
background-color:#ffffff; 
border-radius:10px; 
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.measurement{ 
text-align:center; 
margin:10px 0; 
font-size:18px; 
background-color:#FFFACD; 
border-radius:8px; 
padding:5px; 
font-weight:bold; 
color:black; 
}

input[type="text"], input[type="date"], textarea{ 
width:120px; 
padding:8px; 
text-align:center; 
font-size:16px; 
border:2px solid #FF8C00; 
border-radius:4px; 
}

textarea{ 
width:100%; 
height:100px; 
padding:10px; 
text-align:left; 
resize:vertical; 
border:2px solid #FF8C00; 
border-radius:6px;
}

.info-table{ 
width:100%; 
margin-bottom:20px; 
}

.info-table td{ 
padding:5px 0; 
text-align:left; 
}

.signature{ 
margin-top:50px; 
border-top:2px solid #FF8C00; 
width:320px; 
padding-top:5px; 
text-align:center; 
font-weight:bold; 
font-size:16px; 
position:relative; 
}

#assinatura{ 
position:absolute; 
top:-36px; 
left:0; 
width:320px; 
border:none; 
font-size:28px; 
text-align:center; 
background:transparent; 
outline:none; 
font-family:'Brush Script MT', cursive, Arial, sans-serif; 
color:#257500; 
}

#assinatura::placeholder{ 
color:#999; 
}

.warning{ 
background-color:#257500; 
padding:10px; 
border-left:6px solid #257500; 
margin:15px 0; 
text-align:center; 
color:white;
font-weight:bold;
border-radius:6px;
}

.obs{ 
margin-top:30px; 
font-style:italic; 
background-color:#FFFACD; 
padding:10px; 
border-radius:6px; 
border:1px solid #FF8C00;
}

.button-container{ 
margin-top:20px; 
text-align:center; 
}

button{ 
background-color:#257500; 
color:white; 
border:none; 
padding:10px 20px; 
margin:0 10px; 
font-size:16px; 
border-radius:6px; 
cursor:pointer; 
font-weight:bold;
transition: all 0.3s ease;
}

button:hover{
background-color:#FF4500; 
}

button.clear-btn{ 
background-color:#FF4500; 
}

.photo-box{
width:120px; 
height:120px; 
border:2px dashed #FF8C00; 
margin:10px auto; 
display:flex; 
align-items:center; 
justify-content:center; 
text-align:center; 
font-size:12px; 
color:#666; 
position:relative; 
background-size:cover; 
background-position:center; 
overflow:hidden; 
border-radius:10px;
}

.photo-box input[type="file"]{ 
position:absolute; 
width:100%; 
height:100%; 
opacity:0; 
cursor:pointer; 
}

.remove-photo{ 
display:inline-block; 
margin-left:5px; 
background:#FF4500; 
color:#fff; 
border:none; 
padding:2px 5px; 
font-size:10px; 
cursor:pointer; 
border-radius:4px; 
vertical-align:top; 
}

.photo-label { 
position:absolute; 
bottom:0; 
width:100%; 
text-align:center; 
background-color:#257500; 
color:white; 
font-weight:bold; 
font-size:12px; 
border-top-left-radius:5px; 
border-top-right-radius:5px; 
padding:2px 0; 
}

.cilindro-label { 
text-align:center; 
font-weight:bold; 
color:white; 
background-color:#257500; 
border-radius:10px; 
padding:5px; 
margin-bottom:10px; 
font-size:16px; 
}

@media(max-width:900px){ 
.valve-section{ width:100%; } 
}
</style>
</head>
<body>

<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<table class="info-table">
<tr>
<td><strong>MECÂNICO:</strong> <input type="text" id="mecanico" style="width:200px;"></td>
<td><strong>DATA:</strong> <input type="date" id="data"></td>
</tr>
<tr>
<td><strong>USINA:</strong> <input type="text" id="usina" style="width:200px;"></td>
<td><strong>HORÍMETRO:</strong> <input type="text" id="horimetro"></td>
</tr>
<tr>
<td><strong>SÉRIE:</strong> <input type="text" id="serie" style="width:200px;"></td>
<td><strong>OS:</strong> <input type="text" id="os"></td>
</tr>
<tr>
<td><strong>UGD-</strong> <input type="text" id="ugd" style="width:60px;"></td>
<td></td>
</tr>
</table>

<div class="warning">
<h3>MEDIÇÕES ACEITÁVEIS: 64,00mm a <span style="font-weight:bold; color:red;">67,50mm</span></h3>
<h3>ACIMA DE <span style="font-weight:bold; color:red;">67,50mm</span> DEVE SER CONSIDERADA SUBSTITUIÇÃO</h3>
</div>

<div class="valve-container">
<script>
const container=document.currentScript.parentNode;
for(let i=1;i<=6;i++){
const section=document.createElement('div');
section.className='valve-section';
section.innerHTML=`<div class="cilindro-label">${i}º CILINDRO</div>`;

// Layout 2x2
const layoutDiv = document.createElement('div');
layoutDiv.style.display='grid';
layoutDiv.style.gridTemplateColumns='1fr 1fr';
layoutDiv.style.gridTemplateRows='1fr 1fr';
layoutDiv.style.gap='10px';
layoutDiv.style.justifyContent = 'center'; 
layoutDiv.style.alignContent = 'center'; 

const posicoes=[
{tipo:'exaustao', j:2},
{tipo:'admissao', j:2},
{tipo:'exaustao', j:1},
{tipo:'admissao', j:1}
];

posicoes.forEach(({tipo,j})=>{
const tipoNome = tipo==='exaustao'?'EXAUSTÃO':'ADMISSÃO';
const idPhoto=tipo+i+'_'+j;
const div = document.createElement('div');
div.style.textAlign='center';
div.innerHTML=`
<div class="measurement"><input type="text" id="${tipo}${i}_${j}" placeholder="${tipoNome} ${j}"></div>
<div class="photo-box" id="photo${idPhoto}">
Clique para adicionar foto
<div class="photo-label">${tipoNome} ${j}</div>
<input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,'${idPhoto}')">
</div>
<button class="remove-photo" onclick="removePhoto('${idPhoto}')">REMOVER FOTO</button>
`;
layoutDiv.appendChild(div);
});

// Botão Gerar JPG individual
const btnJpg = document.createElement('button');
btnJpg.textContent = `Gerar JPG CILINDRO ${i}`;
btnJpg.addEventListener('click',()=>gerarJpgCilindro(i));
section.appendChild(layoutDiv);
section.appendChild(btnJpg);
container.appendChild(section);
}
</script>
</div>

<div class="obs">
<p><strong>OBSERVAÇÕES:</strong></p>
<textarea id="observacoes"></textarea>
</div>

<div class="button-container">
<button id="generatePdf">Gerar PDF</button>
<button id="clearBtn" class="clear-btn">Limpar</button>
</div>

<div class="signature">
ASSINATURA DO MECÂNICO: 
<input type="text" id="assinatura" placeholder="Digite seu nome aqui" />
</div>

<script>
const { jsPDF }=window.jspdf;

function loadPhoto(event,id){
const box=document.getElementById('photo'+id);
const file=event.target.files[0];
if(file){
const reader=new FileReader();
reader.onload=function(e){
box.style.backgroundImage=`url('${e.target.result}')`;
box.textContent='';
}
reader.readAsDataURL(file);
}
}

function removePhoto(id){
const box = document.getElementById('photo' + id);
box.style.backgroundImage = '';
box.textContent = 'Clique para adicionar foto';
const oldInput = box.querySelector('input[type="file"]');
if (oldInput) oldInput.remove();
const newInput = document.createElement('input');
newInput.type = 'file';
newInput.accept = 'image/*';
newInput.capture = 'environment';
newInput.onchange = (event) => loadPhoto(event, id);
box.appendChild(newInput);
}

// GERAR PDF
document.getElementById('generatePdf').addEventListener('click', async function(){
const pdf = new jsPDF({unit:'mm', format:'a4'});
// seu código original do PDF...
});

// GERAR JPG por cilindro
async function gerarJpgCilindro(i){
const imgSize = 1280;
const imgHeight = 1700;
const canvasCil = document.createElement('canvas');
canvasCil.width = imgSize;
canvasCil.height = imgHeight;
const ctxCil = canvasCil.getContext('2d');

ctxCil.fillStyle = "#fff";
ctxCil.fillRect(0,0,imgSize,imgHeight);

const fotos = [`photoexaustao${i}_2`,`photoadmissao${i}_2`,`photoexaustao${i}_1`,`photoadmissao${i}_1`];
const legendas = ['EXAUSTÃO 2','ADMISSÃO 2','EXAUSTÃO 1','ADMISSÃO 1'];
const pos = [[0,0],[imgSize/2,0],[0,imgHeight/2],[imgSize/2,imgHeight/2]];

for(let j=0;j<4;j++){
const box=document.getElementById(fotos[j]);
if(box && box.style.backgroundImage){
let imgUrl = box.style.backgroundImage.replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
const imgEl = new Image();
imgEl.src = imgUrl;
await new Promise(resolve=>imgEl.onload=resolve);

ctxCil.drawImage(imgEl,pos[j][0],pos[j][1],imgSize/2,imgHeight/2);

const rectX = pos[j][0], rectY = pos[j][1]+imgHeight/2-40, rectWidth = imgSize/2, rectHeight = 40;
ctxCil.fillStyle="white";
ctxCil.strokeStyle="black";
ctxCil.lineWidth=2;
ctxCil.fillRect(rectX,rectY,rectWidth,rectHeight);
ctxCil.strokeRect(rectX,rectY,rectWidth,rectHeight);

ctxCil.fillStyle="black";
ctxCil.font="bold 30px Arial";
ctxCil.textAlign="center";
ctxCil.textBaseline="middle";
ctxCil.fillText(legendas[j], rectX+rectWidth/2, rectY+rectHeight/2);
}
}

// CILINDRO texto
ctxCil.font="bold 50px Arial";
ctxCil.fillStyle="black";
ctxCil.textAlign="center";
ctxCil.textBaseline="top";
ctxCil.fillText(`CILINDRO ${i}`, imgSize/2, 5);

const link=document.createElement('a');
link.download = `CILINDRO${i}.jpg`;
link.href = canvasCil.toDataURL('image/jpeg',0.95);
link.click();

// Limpar fotos do cilindro
fotos.forEach(id=>{
const box=document.getElementById(id);
if(box){box.style.backgroundImage=''; box.textContent='Clique para adicionar foto';
const oldInput = box.querySelector('input[type="file"]');
if(oldInput) oldInput.remove();
const newInput = document.createElement('input');
newInput.type='file';
newInput.accept='image/*';
newInput.capture='environment';
newInput.onchange = (e)=>loadPhoto(e,id);
box.appendChild(newInput);
});
}

// Forçar coleta de memória
canvasCil.width = 1;
canvasCil.height = 1;
}

// LIMPAR
document.getElementById('clearBtn').addEventListener('click',function(){
const inputs=document.querySelectorAll('input[type="text"], input[type="date"], textarea');
inputs.forEach(input=>input.value='');
const photos=document.querySelectorAll('.photo-box');
photos.forEach(box=>{box.style.backgroundImage=''; box.textContent='Clique para adicionar foto'; const input=box.querySelector('input[type="file"]'); if(input) input.value='';});
});

// DESTAQUE AUTOMÁTICO
function atualizarDestaque(input) {
const valor = parseFloat(input.value.replace(',', '.'));
if (!isNaN(valor) && valor >= 67.50) {
input.style.color = "red";
input.style.fontWeight = "bold";
} else {
input.style.color = "black";
input.style.fontWeight = "normal";
}
}
const allInputs = document.querySelectorAll('input[type="text"]');
allInputs.forEach(input => input.addEventListener('input', ()=>atualizarDestaque(input)));
</script>

</body>
</html>
