<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload de Fotos por Cilindro</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 20px;
  }
  .container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .cilindro {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
  }
  h2 {
    text-align: center;
    margin-bottom: 10px;
  }
  .fotos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .foto {
    width: 100%;
    height: 100px;
    background-color: #ddd;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  input[type="file"] {
    display: none;
  }
  .upload-btn {
    width: 100%;
    height: 100%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 30px;
    color: #555;
    border-radius: 5px;
  }
  textarea {
    width: 100%;
    height: 60px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    padding: 5px;
    resize: none;
  }
  .botoes {
    margin-top: 20px;
    text-align: center;
  }
  .botoes button {
    margin: 5px;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
  }
  .enviar {
    background-color: #4CAF50;
    color: white;
  }
  .limpar {
    background-color: #f44336;
    color: white;
  }
</style>
</head>
<body>

<h1>Upload de Fotos - Cilindros</h1>

<div class="container">
  <!-- Repetição para cada cilindro -->
  <div class="cilindro" id="cilindro1">
    <h2>Cilindro 1</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>

  <div class="cilindro" id="cilindro2">
    <h2>Cilindro 2</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>

  <div class="cilindro" id="cilindro3">
    <h2>Cilindro 3</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>

  <div class="cilindro" id="cilindro4">
    <h2>Cilindro 4</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>

  <div class="cilindro" id="cilindro5">
    <h2>Cilindro 5</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>

  <div class="cilindro" id="cilindro6">
    <h2>Cilindro 6</h2>
    <div class="fotos">
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
      <div class="foto"><label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label></div>
    </div>
    <textarea placeholder="Informações do cilindro"></textarea>
  </div>
</div>

<div class="botoes">
  <button class="enviar" onclick="alert('Enviado!')">Enviar</button>
  <button class="limpar" onclick="limparFotos()">Limpar</button>
</div>

<script>
function previewImage(event, input) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const divFoto = input.closest('.foto');
      divFoto.innerHTML = `<img src="${e.target.result}" alt="Foto">`;
    }
    reader.readAsDataURL(file);
  }
}
function limparFotos() {
  document.querySelectorAll('.foto').forEach(foto => {
    foto.innerHTML = '<label class="upload-btn">📷<input type="file" accept="image/*" onchange="previewImage(event, this)"></label>';
  });
}
</script>

</body>
</html>
