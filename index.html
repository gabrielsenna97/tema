<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envio de Fotos</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f7f7f7;
  }
  .cilindro {
    background: #fff;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }
  .titulo {
    font-weight: bold;
    margin-bottom: 10px;
  }
  .fotos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .foto {
    border: 2px dashed #aaa;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fafafa;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
  }
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<h1>Fotos dos Cilindros</h1>

<div id="cilindros"></div>

<script>
function criarCilindros() {
  const container = document.getElementById('cilindros');
  for (let i = 1; i <= 6; i++) {
    const cilindro = document.createElement('div');
    cilindro.className = 'cilindro';
    cilindro.innerHTML = `<div class="titulo">Cilindro ${i}</div><div class="fotos" id="fotos-c${i}"></div>`;
    container.appendChild(cilindro);

    for (let j = 1; j <= 4; j++) {
      const foto = document.createElement('div');
      foto.className = 'foto';
      foto.textContent = `Foto ${j}`;
      foto.addEventListener('click', () => selecionarImagem(foto));
      document.getElementById(`fotos-c${i}`).appendChild(foto);
    }
  }
}

function selecionarImagem(divFoto) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = ''; // Permite que o celular pergunte câmera ou galeria
  input.onchange = e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = evt => {
        divFoto.innerHTML = `<img src="${evt.target.result}" alt="Foto">`;
      };
      reader.readAsDataURL(file);
    }
  };
  input.click();
}

criarCilindros();
</script>

</body>
</html>
