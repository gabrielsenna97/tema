<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medição de Válvulas do Scania-550</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { 
  font-family: Arial, sans-serif; 
  margin: 20px; 
  line-height: 1.6; 
  background-color: #ffffff;
}
h1,h2,h3{ 
  margin-top:20px; 
  margin-bottom:10px; 
}
h1{ 
  font-size:24px; 
  text-align:center; 
  border-bottom:3px solid #257500; 
  padding-bottom:10px; 
  color: #ffffff; 
  background-color: #257500; 
  border-radius:8px;
}
.valve-container{ 
  display:flex; 
  flex-wrap:wrap; 
  justify-content:space-between; 
  margin-bottom:20px; 
}
.valve-section{ 
  border:2px solid #257500; 
  padding:15px; 
  margin-bottom:20px; 
  width:32%; 
  box-sizing:border-box; 
  background-color:#ffffff; 
  border-radius:10px; 
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
.measurement{ 
  text-align:center; 
  margin:10px 0; 
  font-size:18px; 
  background-color:#FFFACD; 
  border-radius:8px; 
  padding:5px; 
  font-weight:bold; 
  color:black; 
}
input[type="text"], input[type="date"], textarea{ 
  width:120px; 
  padding:8px; 
  text-align:center; 
  font-size:16px; 
  border:2px solid #FF8C00; 
  border-radius:4px; 
}
textarea{ 
  width:100%; 
  height:100px; 
  padding:10px; 
  text-align:left; 
  resize:vertical; 
  border:2px solid #FF8C00; 
  border-radius:6px;
}
.info-table{ 
  width:100%; 
  margin-bottom:20px; 
}
.info-table td{ 
  padding:5px 0; 
  text-align:left; 
}
.signature{ 
  margin-top:50px; 
  border-top:2px solid #FF8C00; 
  width:320px; 
  padding-top:5px; 
  text-align:center; 
  font-weight:bold; 
  font-size:16px; 
  position:relative; 
}
#assinatura{ 
  position:absolute; 
  top:-36px; 
  left:0; 
  width:320px; 
  border:none; 
  font-size:28px; 
  text-align:center; 
  background:transparent; 
  outline:none; 
  font-family:'Brush Script MT', cursive, Arial, sans-serif; 
  color:#257500; 
}
.warning{ 
  background-color:#257500; 
  padding:10px; 
  border-left:6px solid #257500; 
  margin:15px 0; 
  text-align:center; 
  color:white;
  font-weight:bold;
  border-radius:6px;
}
.obs{ 
  margin-top:30px; 
  font-style:italic; 
  background-color:#FFFACD; 
  padding:10px; 
  border-radius:6px; 
  border:1px solid #FF8C00;
}
.button-container{ 
  margin-top:20px; 
  text-align:center; 
}
button{ 
  background-color:#257500; 
  color:white; 
  border:none; 
  padding:10px 20px; 
  margin:0 10px; 
  font-size:16px; 
  border-radius:6px; 
  cursor:pointer; 
  font-weight:bold;
  transition: all 0.3s ease;
}
button:hover{
  background-color:#FF4500; 
}
button.clear-btn{ 
  background-color:#FF4500; 
}
.photo-box{
  width:120px; 
  height:120px; 
  border:2px dashed #FF8C00; 
  margin:10px auto; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  text-align:center; 
  font-size:12px; 
  color:#666; 
  position:relative; 
  background-size:cover; 
  background-position:center; 
  overflow:hidden; 
  border-radius:10px;
}
.photo-box input[type="file"]{ 
  position:absolute; 
  width:100%; 
  height:100%; 
  opacity:0; 
  cursor:pointer; 
}
.remove-photo{ 
  display:inline-block; 
  margin-left:5px; 
  background:#FF4500; 
  color:#fff; 
  border:none; 
  padding:2px 5px; 
  font-size:10px; 
  cursor:pointer; 
  border-radius:4px; 
  vertical-align:top; 
}
.photo-label { 
  position:absolute; 
  bottom:0; 
  width:100%; 
  text-align:center; 
  background-color:#257500; 
  color:white; 
  font-weight:bold; 
  font-size:12px; 
  border-top-left-radius:5px; 
  border-top-right-radius:5px; 
  padding:2px 0; 
}
.cilindro-label { 
  text-align:center; 
  font-weight:bold; 
  color:white; 
  background-color:#257500; 
  border-radius:10px; 
  padding:5px; 
  margin-bottom:10px; 
  font-size:16px; 
}
/* --- TRANSIÇÃO DE TELAS --- */
.tela { display:none; opacity:0; transition: opacity 0.5s ease; }
.tela.active { display:block; opacity:1; }
.nav-buttons { text-align:center; margin-bottom:20px; }
@media(max-width:900px){ 
  .valve-section{ width:100%; } 
}
</style>
</head>
<body>

<h1>MEDIÇÃO DAS VÁLVULAS DO SCANIA-550</h1>

<div id="tela1" class="tela active">
  <table class="info-table">
  <tr>
  <td><strong>MECÂNICO:</strong> <input type="text" id="mecanico" style="width:200px;"></td>
  <td><strong>DATA:</strong> <input type="date" id="data"></td>
  </tr>
  <tr>
  <td><strong>USINA:</strong> <input type="text" id="usina" style="width:200px;"></td>
  <td><strong>HORÍMETRO:</strong> <input type="text" id="horimetro"></td>
  </tr>
  <tr>
  <td><strong>SÉRIE:</strong> <input type="text" id="serie" style="width:200px;"></td>
  <td><strong>OS:</strong> <input type="text" id="os"></td>
  </tr>
  <tr>
  <td><strong>UGD-</strong> <input type="text" id="ugd" style="width:60px;"></td>
  <td></td>
  </tr>
  </table>
</div>

<div id="tela2" class="tela">
  <div class="warning">
  <h3>MEDIÇÕES ACEITÁVEIS: 64,00mm a <span style="font-weight:bold; color:red;">67,50mm</span></h3>
  <h3>ACIMA DE <span style="font-weight:bold; color:red;">67,50mm</span> DEVE SER CONSIDERADA SUBSTITUIÇÃO</h3>
  </div>
  <div class="valve-container">
    <script>
    const container=document.currentScript.parentNode;
    for(let i=1;i<=6;i++){
      const section=document.createElement('div');
      section.className='valve-section';
      section.dataset.cilindro=i;
      section.innerHTML=`<div class="cilindro-label">${i}º CILINDRO</div>`;

      // Layout 2x2
      const layoutDiv = document.createElement('div');
      layoutDiv.style.display='grid';
      layoutDiv.style.gridTemplateColumns='1fr 1fr';
      layoutDiv.style.gridTemplateRows='1fr 1fr';
      layoutDiv.style.gap='10px';
      layoutDiv.style.justifyContent = 'center';
      layoutDiv.style.alignContent = 'center';

      const posicoes=[
        {tipo:'exaustao', j:2},
        {tipo:'admissao', j:2},
        {tipo:'exaustao', j:1},
        {tipo:'admissao', j:1}
      ];
      posicoes.forEach(({tipo,j})=>{
        const tipoNome = tipo==='exaustao'?'EXAUSTÃO':'ADMISSÃO';
        const idPhoto=tipo+i+'_'+j;
        const div = document.createElement('div');
        div.style.textAlign='center';
        div.innerHTML=`
        <div class="measurement"><input type="text" id="${tipo}${i}_${j}" placeholder="${tipoNome} ${j}"></div>
        <div class="photo-box" id="photo${idPhoto}">
        Clique para adicionar foto
        <div class="photo-label">${tipoNome} ${j}</div>
        <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,'${idPhoto}')">
        </div>
        <button class="remove-photo" onclick="removePhoto('${idPhoto}')">REMOVER FOTO</button>
        `;
        layoutDiv.appendChild(div);
      });
      section.appendChild(layoutDiv);
      container.appendChild(section);
    }
    </script>
  </div>
</div>

<div id="tela3" class="tela">
  <div class="obs">
  <p><strong>OBSERVAÇÕES:</strong></p>
  <textarea id="observacoes"></textarea>
  </div>

  <div class="signature">
  ASSINATURA DO MECÂNICO: 
  <input type="text" id="assinatura" placeholder="Digite seu nome aqui" />
  </div>
</div>

<div class="nav-buttons">
  <button id="prevTela">Anterior</button>
  <button id="nextTela">Próximo</button>
</div>

<div class="button-container">
  <button id="generatePdf">Gerar PDF</button>
  <button id="generateJpg">Gerar JPG</button>
  <button id="clearBtn" class="clear-btn">Limpar</button>
</div>

<script>
// --- NAVEGAÇÃO ENTRE TELAS ---
let telaAtual = 0;
const telas = document.querySelectorAll('.tela');
function mostrarTela(index){
  telas.forEach((t,i)=>{ t.classList.remove('active'); });
  telas[index].classList.add('active');
}
document.getElementById('nextTela').addEventListener('click',()=>{
  if(telaAtual < telas.length-1) telaAtual++;
  mostrarTela(telaAtual);
});
document.getElementById('prevTela').addEventListener('click',()=>{
  if(telaAtual > 0) telaAtual--;
  mostrarTela(telaAtual);
});

// --- FUNÇÕES EXISTENTES DO SEU CÓDIGO (PDF, JPG, Fotos, Limpar, Destaque) ---
// **NÃO FOI MEXIDO NADA AQUI**
const { jsPDF}=window.jspdf;
function loadPhoto(event,id){
  const box=document.getElementById('photo'+id);
  const file=event.target.files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=function(e){
      box.style.backgroundImage=`url('${e.target.result}')`;
      box.textContent='';
    }
    reader.readAsDataURL(file);
  }
}
function removePhoto(id){
  const box = document.getElementById('photo' + id);
  box.style.backgroundImage = '';
  box.textContent = 'Clique para adicionar foto';
  const oldInput = box.querySelector('input[type="file"]');
  if (oldInput) oldInput.remove();
  const newInput = document.createElement('input');
  newInput.type = 'file';
  newInput.accept = 'image/*';
  newInput.capture = 'environment';
  newInput.onchange = (event) => loadPhoto(event, id);
  box.appendChild(newInput);
}

// --- O RESTANTE DO SEU CÓDIGO DE PDF/JPG/LIMPAR/DESTAQUE AUTOMÁTICO ---
// Aqui você pode copiar exatamente o código que você tinha antes, sem alterações
</script>

</body>
</html>
